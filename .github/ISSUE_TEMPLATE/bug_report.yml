name: Bug report
description: Report a reproducible Verifact problem without sensitive endpoint data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real endpoint evidence, hostnames, usernames, addresses, domains, or file paths.
  - type: input
    id: version
    attributes:
      label: Verifact version
      placeholder: 2.0.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows collector or normalizer
        - Python CLI
        - Agent skill behavior
        - Report or packaging
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Give minimal steps using only synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
