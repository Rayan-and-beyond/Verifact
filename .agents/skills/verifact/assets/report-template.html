<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifact Assessment</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#12161b;--panel2:#171c22;--text:#f4f5f7;--muted:#9da7b3;--line:#2a323c;--accent:#e8f05a;--danger:#ff6b6b;--warn:#f7c76d;--ok:#7ee787}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--accent)}.shell{max-width:1180px;margin:auto;padding:36px 24px 80px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.04em}.eye{width:32px;height:20px;border:2px solid var(--accent);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;display:grid;place-items:center}.eye:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}h1{font-size:clamp(34px,6vw,66px);line-height:.96;margin:36px 0 14px;letter-spacing:-.04em}.sub{max-width:760px;color:var(--muted);font-size:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:30px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.v{font-size:30px;font-weight:760;margin-top:5px}.section{margin-top:42px}.section h2{font-size:22px;margin-bottom:14px}.finding{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:12px 0}.finding-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.id{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}.title{font-size:20px;font-weight:720;margin:5px 0}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:4px 9px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;font-size:12px;color:var(--muted)}.sev-critical,.sev-high{color:var(--danger)}.sev-medium{color:var(--warn)}.sev-low,.sev-informational{color:var(--ok)}.claim{margin:18px 0;color:#dfe4ea}.evidence{display:grid;gap:8px}.ev{border-left:2px solid var(--line);padding-left:12px;color:var(--muted)}.ev b{color:var(--text)}.empty{color:var(--muted);padding:28px;border:1px dashed var(--line);border-radius:14px}.lim{color:var(--warn)}footer{margin-top:55px;color:var(--muted);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.finding-head{display:block}.chips{margin-top:12px}}@media(max-width:480px){.shell{padding:24px 16px 60px}.grid{grid-template-columns:1fr 1fr}.v{font-size:24px}}
</style>
</head>
<body><main class="shell"><div class="brand"><span class="eye"></span> VERIFACT</div><h1>Endpoint assessment</h1><p class="sub" id="summary"></p><div class="grid" id="metrics"></div><section class="section"><h2>Collection scope</h2><div id="collections"></div></section><section class="section"><h2>Validated findings</h2><div id="validated"></div></section><section class="section"><h2>Rejected and inconclusive</h2><div id="other"></div></section><section class="section"><h2>Coverage & limitations</h2><div id="limitations"></div></section><footer id="footer"></footer></main><script>/*__VERIFACT_DATA__*/</script></body></html>
